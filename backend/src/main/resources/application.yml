server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: smartcity-ops-backend

  datasource:
    # 로컬 Oracle XE 접속 정보 (설치 환경에 맞게 SID 또는 ServiceName 지정)
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@localhost:1521:xe
    username: SMARTCITY_USER
    password: SmartCity2024!
    
    # HikariCP 커넥션 풀 최적화 (PC 리소스 절약)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: egovframework.smartcity.model
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
    call-setters-on-nulls: true

logging:
  level:
    root: INFO
    egovframework.smartcity: DEBUG
    egovframework.smartcity.mapper: DEBUG
